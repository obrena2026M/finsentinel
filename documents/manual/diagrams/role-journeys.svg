troke="#0F766E" stroke-width="2.5"/></g><text x="885" y="158" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#134E4A">4. Run AI review</text><path d="M974,154 L988,154" fill="none" stroke="#0F766E" stroke-width="2.5"  marker-end="url(#arrow-owner)"/><g filter="url(#shadow)"><rect x="988" y="124" width="178" height="60" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5"/></g><text x="1077" y="149" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#134E4A">5. Answer</text><text x="1077" y="167" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#134E4A" textLength="158" lengthAdjust="spacingAndGlyphs">information requests</text><path d="M1166,154 L1180,154" fill="none" stroke="#0F766E" stroke-width="2.5"  marker-end="url(#arrow-owner)"/><g filter="url(#shadow)"><rect x="1180" y="124" width="178" height="60" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5"/></g><text x="1269" y="149" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#134E4A">6. Follow</text><text x="1269" y="167" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#134E4A">the decision</text><rect x="40" y="215" width="1320" height="88" rx="16" fill="#DBEAFE" opacity="0.45"/><rect x="40" y="215" width="160" height="88" rx="16" fill="#1D4ED8"/><text x="120" y="264" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">FCRM Analyst</text><g filter="url(#shadow)"><rect x="220" y="229" width="178" height="60" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/></g><text x="309" y="254" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">1. Sign in as</text><text x="309" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">Kim Analyst</text><path d="M398,259 L412,259" fill="none" stroke="#1D4ED8" stroke-width="2.5"  marker-end="url(#arrow-analyst)"/><g filter="url(#shadow)"><rect x="412" y="229" width="178" height="60" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/></g><text x="501" y="254" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">2. Open case,</text><text x="501" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">read blockers</text><path d="M590,259 L604,259" fill="none" stroke="#1D4ED8" stroke-width="2.5"  marker-end="url(#arrow-analyst)"/><g filter="url(#shadow)"><rect x="604" y="229" width="178" height="60" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/></g><text x="693" y="254" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">3. Confirm facts,</text><text x="693" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" textLength="158" lengthAdjust="spacingAndGlyphs">resolve contradictions</text><path d="M782,259 L796,259" fill="none" stroke="#1D4ED8" stroke-width="2.5"  marker-end="url(#arrow-analyst)"/><g filter="url(#shadow)"><rect x="796" y="229" width="178" height="60" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/></g><text x="885" y="254" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">4. Check claims</text><text x="885" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">&amp; evidence</text><path d="M974,259 L988,259" fill="none" stroke="#1D4ED8" stroke-width="2.5"  marker-end="url(#arrow-analyst)"/><g filter="url(#shadow)"><rect x="988" y="229" width="178" height="60" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/></g><text x="1077" y="254" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">5. Set controls,</text><text x="1077" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" textLength="158" lengthAdjust="spacingAndGlyphs">override with rationale</text><path d="M1166,259 L1180,259" fill="none" stroke="#1D4ED8" stroke-width="2.5"  marker-end="url(#arrow-analyst)"/><g filter="url(#shadow)"><rect x="1180" y="229" width="178" height="60" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/></g><text x="1269" y="254" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">6. Finalize</text><text x="1269" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">→ committee</text><rect x="40" y="320" width="1320" height="88" rx="16" fill="#FEF3C7" opacity="0.45"/><rect x="40" y="320" width="160" height="88" rx="16" fill="#B45309"/><text x="120" y="369" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Risk Committee</text><g filter="url(#shadow)"><rect x="220" y="334" width="178" height="60" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/></g><text x="309" y="359" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#78350F">1. Sign in as</text><text x="309" y="377" text-anchor="middle" font-family="Seg