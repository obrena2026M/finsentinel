<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570"><defs><marker id="arrow-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="arrow-analyst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker><marker id="arrow-committee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="arrow-admin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker><marker id="arrow-rules" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.18"/></filter></defs><rect width="1400" height="570" fill="#F8FAFC"/><text x="40" y="48" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">FinSentinel — journey per role</text><text x="40" y="70" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Each row is a role in simulation sign-in. Actions a role cannot perform are absent from its screens, not greyed out (UX §7).</text><rect x="40" y="110" width="1320" height="88" rx="16" fill="#CCFBF1" opacity="0.45"/><rect x="40" y="110" width="160" height="88" rx="16" fill="#0F766E"/><text x="120" y="159" text-anchor="middle" font-family